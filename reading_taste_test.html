!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>소근소근 독서 취향 테스트</title>
    <style>
        :root {
            --bg-color: #fdf8eb;
            --main-green: #0b663b;
            --accent-green: #148f52;
            --light-green: #eaf5ee;
            --text-dark: #2c3e50;
            --text-muted: #5a6c7d;
            --white: #ffffff;
            --card-shadow: 0 8px 24px rgba(11, 102, 59, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: var(--white);
            border-radius: 24px;
            padding: 35px 25px;
            box-shadow: var(--card-shadow);
            border: 2px solid var(--light-green);
            text-align: center;
            position: relative;
            transition: all 0.3s ease;
        }

        /* 메인 화면 */
        .screen {
            display: none;
        }

        .screen.active {
            display: block;
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            color: var(--main-green);
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 15px;
            margin-bottom: 30px;
        }

        .main-img {
            font-size: 64px;
            margin: 20px 0 30px 0;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* 공통 버튼 */
        .btn {
            background-color: var(--main-green);
            color: var(--white);
            border: none;
            padding: 16px 32px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 14px;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(11, 102, 59, 0.2);
        }

        .btn:hover {
            background-color: var(--accent-green);
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(0);
        }

        /* 진행 바 */
        .progress-container {
            width: 100%;
            height: 8px;
            background-color: var(--light-green);
            border-radius: 10px;
            margin-bottom: 30px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background-color: var(--main-green);
            border-radius: 10px;
            transition: width 0.3s ease;
        }

        .q-number {
            color: var(--main-green);
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .q-text {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 30px;
            line-height: 1.4;
            word-break: keep-all;
        }

        /* 선택지 버튼 목록 */
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background-color: var(--white);
            color: var(--text-dark);
            border: 2px solid var(--light-green);
            padding: 16px 20px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 14px;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease;
            line-height: 1.3;
        }

        .option-btn:hover {
            background-color: var(--light-green);
            border-color: var(--main-green);
            color: var(--main-green);
            padding-left: 24px;
        }

        /* 결과 화면 스타일 */
        .result-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        .result-name {
            font-size: 24px;
            font-weight: 800;
            color: var(--main-green);
            margin-bottom: 25px;
            line-height: 1.3;
        }

        .result-desc {
            font-size: 15px;
            line-height: 1.6;
            color: var(--text-dark);
            margin-bottom: 30px;
            text-align: left;
            background: var(--bg-color);
            padding: 20px;
            border-radius: 16px;
            word-break: keep-all;
        }

        .book-section-title {
            font-size: 16px;
            font-weight: 700;
            text-align: left;
            margin-bottom: 12px;
            color: var(--main-green);
            border-left: 4px solid var(--main-green);
            padding-left: 8px;
        }

        .book-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 30px;
        }

        .book-card {
            background: var(--white);
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            padding: 16px;
            text-align: left;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
        }

        .book-tag {
            display: inline-block;
            font-size: 11px;
            font-weight: 700;
            background: var(--light-green);
            color: var(--main-green);
            padding: 3px 8px;
            border-radius: 6px;
            margin-bottom: 6px;
        }

        .book-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 4px;
        }

        .book-desc {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.4;
        }

        /* 재시작 버튼 간격 */
        .restart-btn {
            margin-top: 10px;
        }

        /* 반응형 모바일 최적화 */
        @media (max-width: 480px) {
            body {
                padding: 10px;
            }
            .container {
                padding: 30px 20px;
                border-radius: 20px;
            }
            h1 {
                font-size: 24px;
            }
            .q-text {
                font-size: 18px;
            }
            .option-btn {
                font-size: 14px;
                padding: 14px 16px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- 1. 시작 화면 -->
        <div id="start-screen" class="screen active">
            <div class="main-img">📚</div>
            <h1>소근소근<br>독서 취향 테스트</h1>
            <p class="subtitle">나도 모르는 나의 숨겨진 독서 성향과<br>내 마음에 쏙 맞춘 인생 책 찾기</p>
            <button class="btn" onclick="startTest()">테스트 시작하기</button>
        </div>

        <!-- 2. 질문 화면 -->
        <div id="question-screen" class="screen">
            <div class="progress-container">
                <div id="progress-bar" class="progress-bar"></div>
            </div>
            <div id="q-number" class="q-number">Question 1 / 10</div>
            <div id="q-text" class="q-text">질문 텍스트</div>
            <div id="options" class="options-list">
                <!-- 자바스크립트로 선택지 주입 -->
            </div>
        </div>

        <!-- 3. 결과 화면 -->
        <div id="result-screen" class="screen">
            <div class="result-title">당신의 독서 취향은?</div>
            <div id="result-name" class="result-name">유형 이름 조합</div>
            <div id="result-desc" class="result-desc">유형 설명</div>
            
            <div class="book-section-title">당신을 위한 맞춤 도서 추천</div>
            <div id="book-list" class="book-list">
                <!-- 자바스크립트로 추천 도서 주입 -->
            </div>

            <button class="btn restart-btn" onclick="restartTest()">테스트 다시하기</button>
        </div>

    </div>

    <script>
        // 10가지 질문 데이터 (A, B, C, D 순서 매칭)
        const questions = [
            {
                q: "영화 볼 때 더 끌리는 장르는?",
                options: [
                    { text: "액션 / 스릴러", type: "A" },
                    { text: "로맨스", type: "B" },
                    { text: "판타지 / SF", type: "C" },
                    { text: "실화 / 다큐", type: "D" }
                ]
            },
            {
                q: "책을 읽는 이유는?",
                options: [
                    { text: "재미", type: "A" },
                    { text: "감정 공감", type: "B" },
                    { text: "새로운 세계 경험", type: "C" },
                    { text: "지식 습득", type: "D" }
                ]
            },
            {
                q: "주인공은 어떤 사람이 좋을까?",
                options: [
                    { text: "능력 있는 영웅", type: "A" },
                    { text: "성장하는 평범한 사람", type: "B" },
                    { text: "독특한 세계관 속 인물", type: "C" },
                    { text: "실제 역사 속 인물", type: "D" }
                ]
            },
            {
                q: "결말은?",
                options: [
                    { text: "통쾌한 해피엔딩", type: "A" },
                    { text: "여운 있는 엔딩", type: "B" },
                    { text: "충격 반전", type: "C" },
                    { text: "현실적인 엔딩", type: "D" }
                ]
            },
            {
                q: "여행 간다면?",
                options: [
                    { text: "액티비티", type: "A" },
                    { text: "감성 카페", type: "B" },
                    { text: "미지의 장소 탐험", type: "C" },
                    { text: "역사 유적지", type: "D" }
                ]
            },
            {
                q: "평소 관심사는?",
                options: [
                    { text: "스포츠 · 도전", type: "A" },
                    { text: "인간관계", type: "B" },
                    { text: "게임 · 애니 · 상상", type: "C" },
                    { text: "자기계발 · 경제", type: "D" }
                ]
            },
            {
                q: "긴 책 VS 짧은 책",
                options: [
                    { text: "짧고 몰입감 있는 책", type: "A" },
                    { text: "상관없음", type: "B" },
                    { text: "길어도 세계관 탄탄하면 OK", type: "C" },
                    { text: "내용만 좋으면 OK", type: "D" }
                ]
            },
            {
                q: "읽고 나서 얻고 싶은 것은?",
                options: [
                    { text: "흥분과 재미", type: "A" },
                    { text: "위로와 공감", type: "B" },
                    { text: "영감과 상상력", type: "C" },
                    { text: "배움과 성장", type: "D" }
                ]
            },
            {
                q: "좋아하는 콘텐츠는?",
                options: [
                    { text: "범죄 · 추리", type: "A" },
                    { text: "드라마", type: "B" },
                    { text: "판타지 / 게임", type: "C" },
                    { text: "경제 · 교양", type: "D" }
                ]
            },
            {
                q: "책 표지를 고른다면?",
                options: [
                    { text: "강렬한 디자인", type: "A" },
                    { text: "감성적인 디자인", type: "B" },
                    { text: "신비로운 디자인", type: "C" },
                    { text: "깔끔하고 전문적인 디자인", type: "D" }
                ]
            }
        ];

        // 각 카테고리 정보 및 도서 풀
        const categoryDetails = {
            "A": {
                name: "스릴만점 프로 추적러",
                desc: "당신은 지루할 틈 없는 빠른 전개와 심장을 쫄깃하게 만드는 사건 중심의 소설을 좋아합니다.",
                books: [
                    { title: "봉제인형 살인사건", desc: "예측 불가능한 반전과 숨막히는 전개가 돋보이는 추리 소설의 대명사." },
                    { title: "파과", desc: "날카롭고 감각적인 액션 묘사와 서사가 완벽하게 어우러진 한국 스릴러 명작." }
                ]
            },
            "B": {
                name: "마음 따뜻한 공감주의자",
                desc: "당신은 인물들의 미묘한 심리 변화에 깊이 공감하며, 위로와 깊은 여운을 주는 이야기를 사랑합니다.",
                books: [
                    { title: "불편한 편의점", desc: "이웃들의 평범한 일상 속에서 가슴 뭉클한 위로와 따뜻함을 전하는 힐링 소설." },
                    { title: "메리골드 마음 세탁소", desc: "마음의 상처를 치유해주는 환상적이면서도 다정한 위로의 이야기." }
                ]
            },
            "C": {
                name: "무한 상상의 세계 모험가",
                desc: "당신은 웅장하고 탄탄한 세계관 속에서 현실을 잊고 완전히 몰입할 수 있는 판타지와 SF를 선호합니다.",
                books: [
                    { title: "달러구트 꿈 백화점", desc: "잠들어야만 입장할 수 있는 상상력 넘치는 신비로운 꿈의 상점 이야기." },
                    { title: "우리가 빛의 속도로 갈 수 없다면", desc: "아름답고도 철학적인 시선으로 우주와 미래를 그려낸 한국 SF 명작 단편집." }
                ]
            },
            "D": {
                name: "지적 성장을 추구하는 스마트 지성인",
                desc: "당신은 책을 통해 새로운 지식을 얻고, 삶에 적용할 수 있는 실질적인 배움과 현실적인 통찰을 얻는 것을 즐깁니다.",
                books: [
                    { title: "세이노의 가르침", desc: "인생을 살아가는 태도와 날카로운 현실 자각을 주는 자기계발의 바이블." },
                    { title: "돈의 속성", desc: "경제적 자유를 얻기 위해 반드시 알아야 할 돈에 대한 통찰과 경제 교양서." }
                ]
            }
        };

        let currentQuestionIndex = 0;
        let scores = { A: 0, B: 0, C: 0, D: 0 };

        function startTest() {
            document.getElementById("start-screen").classList.remove("active");
            document.getElementById("question-screen").classList.add("active");
            currentQuestionIndex = 0;
            scores = { A: 0, B: 0, C: 0, D: 0 };
            showQuestion();
        }

        function showQuestion() {
            const qData = questions[currentQuestionIndex];
            
            // 질문 번호 및 텍스트 업데이트
            document.getElementById("q-number").innerText = `Question ${currentQuestionIndex + 1} / 10`;
            document.getElementById("q-text").innerText = qData.q;
            
            // 진행 바 업데이트
            const progressPercent = ((currentQuestionIndex) / questions.length) * 100;
            document.getElementById("progress-bar").style.width = `${progressPercent}%`;

            // 선택지 버튼들 생성
            const optionsContainer = document.getElementById("options");
            optionsContainer.innerHTML = "";
            
            qData.options.forEach(option => {
                const button = document.createElement("button");
                button.className = "option-btn";
                button.innerText = option.text;
                button.onclick = () => selectOption(option.type);
                optionsContainer.appendChild(button);
            });
        }

        function selectOption(type) {
            scores[type]++;
            currentQuestionIndex++;

            if (currentQuestionIndex < questions.length) {
                showQuestion();
            } else {
                // 진행바 100% 채우고 결과 화면으로
                document.getElementById("progress-bar").style.width = "100%";
                setTimeout(showResult, 200);
            }
        }

        function showResult() {
            document.getElementById("question-screen").classList.remove("active");
            document.getElementById("result-screen").classList.add("active");

            // 점수가 높은 순서대로 카테고리 정렬하기 (상위 2-3개 추출용)
            const sortedTypes = Object.keys(scores).sort((a, b) => scores[b] - scores[a]);
            
            // 1위와 2위 유형 선택 (동점일 경우 정렬된 순서대로 진행됨)
            const top1 = sortedTypes[0];
            const top2 = sortedTypes[1];
            const top3 = sortedTypes[2];

            // 결과 이름 조합하기 (1위의 수식어 + 2위의 핵심 단어 형태로 매끄럽게 연출)
            let combinedName = "";
            let combinedDesc = "";
            
            // 1위, 2위 특징을 융합한 타이틀과 설명 세팅
            const nameMap = {
                "A": "스릴러/추리",
                "B": "감성/에세이",
                "C": "판타지/SF",
                "D": "자기계발/지성"
            };
            
            combinedName = `${nameMap[top1]} x ${nameMap[top2]} 융합형 취향`;
            combinedDesc = `당신의 메인 취향은 [${categoryDetails[top1].name}]이며, 서브 취향으로 [${categoryDetails[top2].name}] 성향도 함께 가지고 계시네요! 

${categoryDetails[top1].desc} 더불어 ${categoryDetails[top2].desc.replace("당신은 ", "")} 두 가지 매력을 모두 가진 책들을 추천해 드립니다.`;

            document.getElementById("result-name").innerText = combinedName;
            document.getElementById("result-desc").innerText = combinedDesc;

            // 상위 2-3개 유형의 책들을 모아서 추천 목록 만들기
            const bookListContainer = document.getElementById("book-list");
            bookListContainer.innerHTML = "";

            // 1위 유형에서 2권, 2위 유형에서 1권 총 3권 추천
            let recommendedBooks = [];
            
            // 1위 도서 추가
            categoryDetails[top1].books.forEach(b => {
                recommendedBooks.push({ ...b, tag: nameMap[top1] });
            });
            // 2위 도서 추가 (첫 번째 책만)
            recommendedBooks.push({ ...categoryDetails[top2].books[0], tag: nameMap[top2] });

            // 화면에 도서 카드 그리기
            recommendedBooks.forEach(book => {
                const card = document.createElement("div");
                card.className = "book-card";
                card.innerHTML = `
                    <div class="book-tag">${book.tag} 추천</div>
                    <div class="book-title">📖 ${book.title}</div>
                    <div class="book-desc">${book.desc}</div>
                `;
                bookListContainer.appendChild(book.box || card); // fallback
            });
        }

        function restartTest() {
            document.getElementById("result-screen").classList.remove("active");
            startTest();
        }
    </script>
</body>
</html>
