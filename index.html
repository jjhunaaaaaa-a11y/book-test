<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>소근소근 독서 취향 테스트</title>
    <style>
        :root {
            --bg-color: #fdf8eb;
            --main-green: #0b663b;
            --accent-green: #148f52;
            --light-green: #eaf5ee;
            --text-dark: #2c3e50;
            --text-muted: #5a6c7d;
            --white: #ffffff;
            --card-shadow: 0 8px 24px rgba(11, 102, 59, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: var(--white);
            border-radius: 24px;
            padding: 35px 25px;
            box-shadow: var(--card-shadow);
            border: 2px solid var(--light-green);
            text-align: center;
            position: relative;
            transition: all 0.3s ease;
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            color: var(--main-green);
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 15px;
            margin-bottom: 30px;
        }

        .main-img {
            margin: 20px 0 30px 0;
        }
        
        .main-img img {
            display: inline-block;
            vertical-align: middle;
        }

        .btn {
            background-color: var(--main-green);
            color: var(--white);
            border: none;
            padding: 16px 32px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 14px;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(11, 102, 59, 0.2);
        }

        .btn:hover {
            background-color: var(--accent-green);
            transform: translateY(-2px);
        }

        .progress-container {
            width: 100%;
            height: 8px;
            background-color: var(--light-green);
            border-radius: 10px;
            margin-bottom: 30px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background-color: var(--main-green);
            border-radius: 10px;
            transition: width 0.3s ease;
        }

        .q-number {
            color: var(--main-green);
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .q-text {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 30px;
            line-height: 1.4;
            word-break: keep-all;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background-color: var(--white);
            color: var(--text-dark);
            border: 2px solid var(--light-green);
            padding: 16px 20px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 14px;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease;
            line-height: 1.3;
        }

        .option-btn:hover {
            background-color: var(--light-green);
            border-color: var(--main-green);
            color: var(--main-green);
            padding-left: 24px;
        }

        .result-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        .result-name {
            font-size: 24px;
            font-weight: 800;
            color: var(--main-green);
            margin-bottom: 25px;
            line-height: 1.3;
        }

        .result-desc {
            font-size: 15px;
            line-height: 1.6;
            color: var(--text-dark);
            margin-bottom: 30px;
            text-align: left;
            background: var(--bg-color);
            padding: 20px;
            border-radius: 16px;
            word-break: keep-all;
            white-space: pre-line;
        }

        .book-section-title {
            font-size: 16px;
            font-weight: 700;
            text-align: left;
            margin-bottom: 12px;
            color: var(--main-green);
            border-left: 4px solid var(--main-green);
            padding-left: 8px;
        }

        .book-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 30px;
        }

        .book-card {
            background: var(--white);
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            padding: 16px;
            text-align: left;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
        }

        .book-tag {
            display: inline-block;
            font-size: 11px;
            font-weight: 700;
            background: var(--light-green);
            color: var(--main-green);
            padding: 3px 8px;
            border-radius: 6px;
            margin-bottom: 6px;
        }

        .book-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 4px;
        }

        .book-desc {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.4;
        }

        .restart-btn {
            margin-top: 10px;
        }

        @media (max-width: 480px) {
            body { padding: 10px; }
            .container { padding: 30px 20px; border-radius: 20px; }
            h1 { font-size: 24px; }
            .q-text { font-size: 18px; }
            .option-btn { font-size: 14px; padding: 14px 16px; }
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- 1. 시작 화면 -->
        <div id="start-screen" class="screen active">
            <div class="main-img">
                <img src="logo.png" alt="소근소근 로고" style="width: 260px; height: auto;">
            </div>
            <h1>소근소근<br>독서 취향 테스트</h1>
            <p class="subtitle">나도 모르는 나의 숨겨진 독서 성향과<br>내 마음에 쏙 맞춘 인생 책 찾기</p>
            <button class="btn" onclick="startTest()">테스트 시작하기</button>
        </div>

        <!-- 2. 질문 화면 -->
        <div id="question-screen" class="screen">
            <div class="progress-container">
                <div id="progress-bar" class="progress-bar"></div>
            </div>
            <div id="q-number" class="q-number">Question 1 / 10</div>
            <div id="q-text" class="q-text">질문 텍스트</div>
            <div id="options" class="options-list"></div>
        </div>

        <!-- 3. 결과 화면 -->
        <div id="result-screen" class="screen">
            <div class="result-title">당신의 독서 취향은?</div>
            <div id="result-name" class="result-name">유형 이름 조합</div>
            <div id="result-desc" class="result-desc">유형 설명</div>
            
            <div class="book-section-title">당신을 위한 맞춤 도서 추천</div>
            <div id="book-list" class="book-list"></div>

            <button class="btn restart-btn" onclick="restartTest()">테스트 다시하기</button>
        </div>

    </div>

    <script>
        // 10가지 질문 데이터
        const questions = [
            {
                q: "영화 볼 때 더 끌리는 장르는?",
                options: [
                    { text: "액션 / 스릴러", type: "A" },
                    { text: "로맨스", type: "B" },
                    { text: "판타지 / SF", type: "C" },
                    { text: "실화 / 다큐", type: "D" }
                ]
            },
            {
                q: "책을 읽는 이유는?",
                options: [
                    { text: "재미", type: "A" },
                    { text: "감정 공감", type: "B" },
                    { text: "새로운 세계 경험", type: "C" },
                    { text: "지식 습득", type: "D" }
                ]
            },
            {
                q: "주인공은 어떤 사람이 좋을까?",
                options: [
                    { text: "능력 있는 영웅", type: "A" },
                    { text: "성장하는 평범한 사람", type: "B" },
                    { text: "독특한 세계관 속 인물", type: "C" },
                    { text: "실제 역사 속 인물", type: "D" }
                ]
            },
            {
                q: "결말은?",
                options: [
                    { text: "통쾌한 해피엔딩", type: "A" },
                    { text: "여운 있는 엔딩", type: "B" },
                    { text: "충격 반전", type: "C" },
                    { text: "현실적인 엔딩", type: "D" }
                ]
            },
            {
                q: "여행 간다면?",
                options: [
                    { text: "액티비티", type: "A" },
                    { text: "감성 카페", type: "B" },
                    { text: "미지의 장소 탐험", type: "C" },
                    { text: "역사 유적지", type: "D" }
                ]
            },
            {
                q: "평소 관심사는?",
                options: [
                    { text: "스포츠 · 도전", type: "A" },
                    { text: "인간관계", type: "B" },
                    { text: "게임 · 애니 · 상상", type: "C" },
                    { text: "자기계발 · 경제", type: "D" }
                ]
            },
            {
                q: "긴 책 VS 짧은 책",
                options: [
                    { text: "짧고 몰입감 있는 책", type: "A" },
                    { text: "상관없음", type: "B" },
                    { text: "길어도 세계관 탄탄하면 OK", type: "C" },
                    { text: "내용만 좋으면 OK", type: "D" }
                ]
            },
            {
                q: "읽고 나서 얻고 싶은 것은?",
                options: [
                    { text: "흥분과 재미", type: "A" },
                    { text: "위로와 공감", type: "B" },
                    { text: "영감과 상상력", type: "C" },
                    { text: "배움과 성장", type: "D" }
                ]
            },
            {
                q: "좋아하는 콘텐츠는?",
                options: [
                    { text: "범죄 · 추리", type: "A" },
                    { text: "드라마", type: "B" },
                    { text: "판타지 / 게임", type: "C" },
                    { text: "경제 · 교양", type: "D" }
                ]
            },
            {
                q: "책 표지를 고른다면?",
                options: [
                    { text: "강렬한 디자인", type: "A" },
                    { text: "감성적인 디자인", type: "B" },
                    { text: "신비로운 디자인", type: "C" },
                    { text: "깔끔하고 전문적인 디자인", type: "D" }
                ]
            }
        ];

        // 100권 도서 데이터베이스 (오타 수리 완료)
        const categoryDetails = {
            "A": {
                name: "스릴만점 프로 추적러",
                desc: "당신은 지루할 틈 없는 빠른 전개와 심장을 쫄깃하게 만드는 사건 중심의 소설을 좋아합니다.",
                books: [
                    { title: "그리고 아무도 없었다", desc: "추리 소설의 여왕 아가사 크리스티가 선사하는 외딴섬의 완벽한 밀실 잔혹극." },
                    { title: "셜록 홈즈 시리즈", desc: "영원한 명탐정 셜록 홈즈와 왓슨 콤비의 기발하고 짜릿한 명수사 기록." },
                    { title: "다빈치 코드", desc: "종교 예술적 기호와 암호를 추적해 나가는 전 세계를 뒤흔든 지적 스릴러." },
                    { title: "용의자 X의 헌신", desc: "천재 수학자가 설계한 완벽한 알리바이를 깨뜨리는 가슴 시린 정통 추리극." },
                    { title: "화차", desc: "한 여인의 실종을 쫓으며 현대 자본주의 신용사회의 어두운 민낯과 마주하는 걸작." },
                    { title: "7년의 밤", desc: "우발적 사고와 잔혹한 복수, 한순간의 실수로 비극에 빠진 두 남자의 압도적 추격전." },
                    { title: "모방범", desc: "범죄가 사회와 인간 내면에 미치는 파장을 아주 집요하고 밀도 높게 그려낸 거작." },
                    { title: "백설공주에게 죽음을", desc: "폐쇄적인 시골 마을의 위선과 10년 전 사라진 진실을 파헤치는 독일 정통 미스터리." },
                    { title: "살인자의 기억법", desc: "알츠하이머에 걸린 은퇴한 연쇄살인범의 희미해지는 기억과 딸을 지키기 위한 사투." },
                    { title: "악의", desc: "범인이 누구인가가 아닌, 범행을 저지른 인간의 지독한 '동기'를 파고드는 집요한 추리." },
                    { title: "가면산장 살인사건", desc: "탈출 불가능한 산장에 고립된 인물들과 반전에 반전을 거듭하는 영리한 반전극." },
                    { title: "미저리", desc: "스티븐 킹이 그려낸 인간의 광기 어린 집착과 숨 막히는 탈출 심리 스릴러." },
                    { title: "본 아이덴티티", desc: "기억을 잃은 최정예 요원이 자신을 노리는 음모 속에서 정체성을 찾아가는 액션 첩보 소설." },
                    { title: "검은 집", desc: "마음이 없는 사이코패스와 마주한 보험 사정인의 극한의 공포를 다룬 정통 스릴러." },
                    { title: "양들의 침묵", desc: "희대의 살인마 한니발 렉터 박사와 FBI 수습 요원의 소름 돋는 심리 두뇌 싸움." },
                    { title: "봉제인형 살인사건", desc: "신체 부위들이 기괴하게 기워진 살인사건과 예고된 죽음을 막으려는 긴박한 수사극." },
                    { title: "파과", desc: "노년에 접어든 여성 킬러의 시선으로 바라본 삶의 쇠락과 날카롭고 감각적인 액션 서사." },
                    { title: "돌이킬 수 없는 약속", desc: "과거의 어두운 죄와 약속이 편지가 되어 찾아오며 삶을 뒤흔드는 일본 미스터리 히트작." },
                    { title: "종의 기원", desc: "순수한 악의 뇌를 가진 청년이 살인을 자각해 나가는 정유정 작가의 압도적 사이코패스 스릴러." },
                    { title: "구미호 식당", desc: "이승과 저승 사이의 미스터리한 공간에서 벌어지는 삶과 죽음에 대한 추적 이야기." },
                    { title: "홍학의 자리", desc: "호숫가에 시체를 유기한 교사와 사건을 둘러싼 충격적인 반전이 몰아치는 한국 미스터리 소설." },
                    { title: "가재가 노래하는 곳", desc: "외딴 습지에서 홀로 자란 소녀의 성장기와 미스터리한 살인사건의 진실을 다룬 대작." },
                    { title: "테라피", desc: "정신과 의사의 사라진 딸을 둘러싼 왜곡된 기억과 충격적인 심리 반전 스릴러." },
                    { title: "초대받지 못한 손님", desc: "눈보라로 고립된 산장에서 벌어지는 의문의 살인사건과 인물들 간의 팽팽한 심리전." },
                    { title: "칵테일, 러브, 좀비", desc: "좀비와 미스터리, 일상의 공포를 독특하고 감각적인 시선으로 엮어낸 한국 단편 미스터리 소설." }
                ]
            },
            "B": {
                name: "마음 따뜻한 공감주의자",
                desc: "당신은 인물들의 미묘한 심리 변화에 깊이 공감하며, 위로와 깊은 여운을 주는 이야기를 사랑합니다.",
                books: [
                    { title: "연금술사", desc: "자신의 자아의 신화를 찾아 보물 여행을 떠나는 소년의 영혼 어린 인생 이야기." },
                    { title: "상실의 시대", desc: "방황하는 청춘들의 고독과 쓸쓸한 사랑, 상실과 성장을 섬세하게 그려낸 무라카미 하루키의 명작." },
                    { title: "작은 아씨들", desc: "서로 다른 개성을 가진 네 자매의 다정한 연대와 따뜻한 가족 사랑을 그린 클래식 드라마." },
                    { title: "오베라는 남자", desc: "세상 까칠하지만 속정 깊은 독거노인 오베가 이웃들과 부딪히며 마음을 열어가는 치유극." },
                    { title: "모순", desc: "우리네 인생 속에 숨겨진 사랑과 슬픔의 모순을 날카롭고도 다정한 문체로 짚어낸 스테디셀러." },
                    { title: "미움받을 용기", desc: "타인의 시선에서 자유로워져 진정한 행복을 찾을 수 있는 방법을 일깨워주는 심리 대화." },
                    { title: "인간 실격", desc: "위선적인 인간 세상 속에서 순수함을 지키려다 파멸해가는 청춘의 고독한 내면 기록." },
                    { title: "어린 왕자", desc: "순수한 아이의 눈으로 세상을 바라보며 진정으로 중요한 가치가 무엇인지 일깨워주는 어른들의 동화." },
                    { title: "창문 넘어 도망친 100세 노인", desc: "100세 생일에 양로원을 탈출한 할아버지가 벌이는 파란만장하고 유쾌한 인생 역정 소설." },

                    { title: "그릿 (GRIT)", desc: "성공을 결정짓는 것은 천재적인 재능이 아니라, 끝까지 해내고야 마는 열정과 끈기임을 증명하는 책." },
                    { title: "아주 작은 습관의 힘", desc: "매일 1%씩 성장하는 나를 만드는 시스템, 원자처럼 작은 습관이 만드는 거대한 인생 변화." },
                    { title: "초집중 (Indistractable)", desc: "스마트폰과 알림 등 디지털 유혹이 가득한 세상에서 내 집중력을 완벽하게 사수하는 방법." }

        let currentQuestionIndex = 0;
        let scores = { A: 0, B: 0, C: 0, D: 0 };

        function startTest() {
            document.getElementById("start-screen").classList.remove("active");
            document.getElementById("question-screen").classList.add("active");
            currentQuestionIndex = 0;
            scores = { A: 0, B: 0, C: 0, D: 0 };
            showQuestion();
        }

        function showQuestion() {
            const qData = questions[currentQuestionIndex];
            
            document.getElementById("q-number").innerText = `Question ${currentQuestionIndex + 1} / 10`;
            document.getElementById("q-text").innerText = qData.q;
            
            const progressPercent = (currentQuestionIndex / questions.length) * 100;
            document.getElementById("progress-bar").style.width = `${progressPercent}%`;

            const optionsContainer = document.getElementById("options");
            optionsContainer.innerHTML = "";
            
            qData.options.forEach(option => {
                const button = document.createElement("button");
                button.className = "option-btn";
                button.innerText = option.text;
                button.onclick = () => selectOption(option.type);
                optionsContainer.appendChild(button);
            });
        }

        function selectOption(type) {
            scores[type]++;
            currentQuestionIndex++;

            if (currentQuestionIndex < questions.length) {
                showQuestion();
            } else {
                document.getElementById("progress-bar").style.width = "100%";
                setTimeout(showResult, 200);
            }
        }

        // 피셔-예이츠 셔플 알고리즘
        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        function showResult() {
            document.getElementById("question-screen").classList.remove("active");
            document.getElementById("result-screen").classList.add("active");

            // 🌟 [수정 완료] 동점자 편향 문제를 없애기 위해 기본 순서를 먼저 셔플
            let baseCategories = ['A', 'B', 'C', 'D'];
            baseCategories = shuffle(baseCategories);

            // 무작위로 섞인 순서 위에서 점수 기반 정렬 진행 (동점 시 완벽한 공평함 보장)
            const sortedTypes = baseCategories.sort((a, b) => scores[b] - scores[a]);
            
            const top1 = sortedTypes[0];
            const top2 = sortedTypes[1];

            const nameMap = {
                "A": "스릴러/추리",
                "B": "감성/에세이",
                "C": "판타지/SF",
                "D": "자기계발/지성"
            };
            
            let combinedName = `${nameMap[top1]} x ${nameMap[top2]} 융합형 취향`;
            let combinedDesc = `당신의 메인 취향은 [${categoryDetails[top1].name}]이며, 서브 취향으로 [${categoryDetails[top2].name}] 성향도 함께 가지고 계시네요! \n\n${categoryDetails[top1].desc} 더불어 ${categoryDetails[top2].desc.replace("당신은 ", "")} 두 가지 매력을 모두 가진 책들을 추천해 드립니다.`;

            document.getElementById("result-name").innerText = combinedName;
            document.getElementById("result-desc").innerText = combinedDesc;

            const bookListContainer = document.getElementById("book-list");
            bookListContainer.innerHTML = ""; // 이전 흔적 완전 청소

            let recommendedBooks = [];
            
            const shuffledTop1Books = shuffle([...categoryDetails[top1].books]);
            const shuffledTop2Books = shuffle([...categoryDetails[top2].books]);

            // 1위 장르에서 무작위 2권
            shuffledTop1Books.slice(0, 2).forEach(b => {
                recommendedBooks.push({ ...b, tag: nameMap[top1] });
            });

            // 2위 장르에서 무작위 1권
            shuffledTop2Books.slice(0, 1).forEach(b => {
                recommendedBooks.push({ ...b, tag: nameMap[top2] });
            });

            recommendedBooks.forEach(book => {
                const card = document.createElement("div");
                card.className = "book-card";
                card.innerHTML = `
                    <div class="book-tag">${book.tag} 추천</div>
                    <div class="book-title">📖 ${book.title}</div>
                    <div class="book-desc">${book.desc}</div>
                `;
                bookListContainer.appendChild(card);
            });
        }

        function restartTest() {
            document.getElementById("result-screen").classList.remove("active");
            startTest();
        }
    </script>
</body>
</html>
