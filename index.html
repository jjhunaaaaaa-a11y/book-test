<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>소근소근 독서 취향 테스트</title>
    <style>
        :root {
            --bg-color: #fdf8eb;
            --main-green: #0b663b;
            --accent-green: #148f52;
            --light-green: #eaf5ee;
            --text-dark: #2c3e50;
            --text-muted: #5a6c7d;
            --white: #ffffff;
            --card-shadow: 0 8px 24px rgba(11, 102, 59, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: var(--white);
            border-radius: 24px;
            padding: 35px 25px;
            box-shadow: var(--card-shadow);
            border: 2px solid var(--light-green);
            text-align: center;
            position: relative;
            transition: all 0.3s ease;
        }

        /* 메인 화면 */
        .screen {
            display: none;
        }

        .screen.active {
            display: block;
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            color: var(--main-green);
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 15px;
            margin-bottom: 30px;
        }

        .main-img {
            font-size: 64px;
            margin: 20px 0 30px 0;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* 공통 버튼 */
        .btn {
            background-color: var(--main-green);
            color: var(--white);
            border: none;
            padding: 16px 32px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 14px;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(11, 102, 59, 0.2);
        }

        .btn:hover {
            background-color: var(--accent-green);
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(0);
        }

        /* 진행 바 */
        .progress-container {
            width: 100%;
            height: 8px;
            background-color: var(--light-green);
            border-radius: 10px;
            margin-bottom: 30px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background-color: var(--main-green);
            border-radius: 10px;
            transition: width 0.3s ease;
        }

        .q-number {
            color: var(--main-green);
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .q-text {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 30px;
            line-height: 1.4;
            word-break: keep-all;
        }

        /* 선택지 버튼 목록 */
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background-color: var(--white);
            color: var(--text-dark);
            border: 2px solid var(--light-green);
            padding: 16px 20px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 14px;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease;
            line-height: 1.3;
        }

        .option-btn:hover {
            background-color: var(--light-green);
            border-color: var(--main-green);
            color: var(--main-green);
            padding-left: 24px;
        }

        /* 결과 화면 스타일 */
        .result-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        .result-name {
            font-size: 24px;
            font-weight: 800;
            color: var(--main-green);
            margin-bottom: 25px;
            line-height: 1.3;
        }

        .result-desc {
            font-size: 15px;
            line-height: 1.6;
            color: var(--text-dark);
            margin-bottom: 30px;
            text-align: left;
            background: var(--bg-color);
            padding: 20px;
            border-radius: 16px;
            word-break: keep-all;
            white-space: pre-line;
        }

        .book-section-title {
            font-size: 16px;
            font-weight: 700;
            text-align: left;
            margin-bottom: 12px;
            color: var(--main-green);
            border-left: 4px solid var(--main-green);
            padding-left: 8px;
        }

        .book-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 30px;
        }

        .book-card {
            background: var(--white);
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            padding: 16px;
            text-align: left;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
        }

        .book-tag {
            display: inline-block;
            font-size: 11px;
            font-weight: 700;
            background: var(--light-green);
            color: var(--main-green);
            padding: 3px 8px;
            border-radius: 6px;
            margin-bottom: 6px;
        }

        .book-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 4px;
        }

        .book-desc {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.4;
        }

        /* 재시작 버튼 간격 */
        .restart-btn {
            margin-top: 10px;
        }

        /* 반응형 모바일 최적화 */
        @media (max-width: 480px) {
            body {
                padding: 10px;
            }
            .container {
                padding: 30px 20px;
                border-radius: 20px;
            }
            h1 {
                font-size: 24px;
            }
            .q-text {
                font-size: 18px;
            }
            .option-btn {
                font-size: 14px;
                padding: 14px 16px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- 1. 시작 화면 -->
        <div id="start-screen" class="screen active">
            <div class="main-img">📚</div>
            <h1>소근소근<br>독서 취향 테스트</h1>
            <p class="subtitle">나도 모르는 나의 숨겨진 독서 성향과<br>내 마음에 쏙 맞춘 인생 책 찾기</p>
            <button class="btn" onclick="startTest()">테스트 시작하기</button>
        </div>

        <!-- 2. 질문 화면 -->
        <div id="question-screen" class="screen">
            <div class="progress-container">
                <div id="progress-bar" class="progress-bar"></div>
            </div>
            <div id="q-number" class="q-number">Question 1 / 10</div>
            <div id="q-text" class="q-text">질문 텍스트</div>
            <div id="options" class="options-list">
                <!-- 자바스크립트로 선택지 주입 -->
            </div>
        </div>

        <!-- 3. 결과 화면 -->
        <div id="result-screen" class="screen">
            <div class="result-title">당신의 독서 취향은?</div>
            <div id="result-name" class="result-name">유형 이름 조합</div>
            <div id="result-desc" class="result-desc">유형 설명</div>
            
            <div class="book-section-title">당신을 위한 맞춤 도서 추천</div>
            <div id="book-list" class="book-list">
                <!-- 자바스크립트로 추천 도서 주입 -->
            </div>

            <button class="btn restart-btn" onclick="restartTest()">테스트 다시하기</button>
        </div>

    </div>

    <script>
        // 10가지 질문 데이터
        const questions = [
            {
                q: "영화 볼 때 더 끌리는 장르는?",

            {

            },
            {

                ]
            },
            {
                q: "결말은?",

                    { text: "충격 반전", type: "C" },
                    { text: "현실적인 엔딩", type: "D" }
                ]
            },
            {

                options: [
                    { text: "액티비티", type: "A" },
                    { text: "감성 카페", type: "B" },
                    { text: "미지의 장소 탐험", type: "C" },

                    { text: "길어도 세계관 탄탄하면 OK", type: "C" },

                ]
            },
            {
                q: "읽고 나서 얻고 싶은 것은?",
                options: [
                    { text: "흥분과 재미", type: "A" },
                    { text: "위로와 공감", type: "B" },
                    { text: "영감과 상상력", type: "C" },
                    { text: "배움과 성장", type: "D" }
                ]
            },
            {
                q: "좋아하는 콘텐츠는?",
                options: [
                    { text: "범죄 · 추리", type: "A" },
                    { text: "드라마", type: "B" },
                    { text: "판타지 / 게임", type: "C" },
                    { text: "경제 · 교양", type: "D" }
                ]
            },
            {
                q: "책 표지를 고른다면?",
                options: [
                    { text: "강렬한 디자인", type: "A" },
                    { text: "감성적인 디자인", type: "B" },
                    { text: "신비로운 디자인", type: "C" },
                    { text: "깔끔하고 전문적인 디자인", type: "D" }
                ]
            }
        ];

        // 🌟 완벽한 100권 도서 대형 라이브러리 구축 (유형별 25권씩)
        const categoryDetails = {
            "A": {
                name: "스릴만점 프로 추적러",
                desc: "당신은 지루할 틈 없는 빠른 전개와 심장을 쫄깃하게 만드는 사건 중심의 소설을 좋아합니다.",
                books: [
                    { title: "봉제인형 살인사건", desc: "예측 불가능한 반전과 숨막히는 전개가 돋보이는 추리 소설의 대명사." },
                    { title: "파과", desc: "날카롭고 감각적인 액션 묘사와 서사가 완벽하게 어우러진 한국 스릴러 명작." },
                    { title: "7년의 밤", desc: "한순간의 실수로 얽혀버린 두 남자의 지독한 복수와 추적을 그린 압도적 서사 소설." },
                    { title: "백설공주에게 죽음을", desc: "닫힌 마을 속 인간들의 추악한 본성과 진실을 파헤치는 독일 정통 미스터리 수사극." },
                    { title: "용의자 X의 헌신", desc: "천재 수학자가 짜놓은 완벽한 알리바이를 풀어가는 가슴 시린 본격 추리 소설." },
                    { title: "다빈치 코드", desc: "예술과 종교적 미스터리를 추적하는 전 세계적인 메가 히트 지적 스릴러." },
                    { title: "화차", desc: "한 여인의 실종을 추적하며 자본주의의 어두운 이면과 마주하는 일본 미스터리 걸작." },
                    { title: "그리고 아무도 없었다", desc: "추리 소설의 여왕 아가사 크리스티가 선사하는 고립된 섬의 완벽한 밀실 살인극." },
                    { title: "종의 기원", desc: "순수한 악인의 내면과 심리를 치밀하게 파헤치는 정유정 작가의 압도적인 사이코패스 스릴러." },
                    { title: "셜록 홈즈 시리즈", desc: "추리 소설의 영원한 클래식, 천재 탐정 셜록 홈즈와 왓슨의 기발한 사건 해결 기록." },
                    { title: "살인자의 기억법", desc: "알츠하이머에 걸린 연쇄살인범이 딸을 지키기 위해 벌이는 숨막히는 사투." },
                    { title: "가면산장 살인사건", desc: "반전에 반전을 거듭하는 히가시노 게이고의 영리하고 짜릿한 밀실 미스터리." },
                    { title: "디 오더", desc: "바티칸을 배경으로 펼쳐지는 전직 첩보원의 비밀스러운 음모 추적 스릴러." },
                    { title: "돌이킬 수 없는 약속", desc: "과거에 했던 위험한 약속이 편지가 되어 돌아오며 숨통을 조여오는 복수극." },
                    { title: "테라피", desc: "정신과 의사의 사라진 딸을 둘러싼 왜곡된 기억과 충격적인 심리 반전 스릴러." },
                    { title: "나를 찾아줘", desc: "완벽해 보이던 부부의 실종 사건 뒤에 숨겨진 잔혹하고 영리한 심리 싸움." },

                    { title: "악의", desc: "범인이 누구인가가 아닌, 범행을 저지른 '동기'를 소름 끼치도록 집요하게 추적하는 소설." }

                books: [
                    { title: "불편한 편의점", desc: "이웃들의 평범한 일상 속에서 가슴 뭉클한 위로와 따뜻함을 전하는 힐링 소설." },

                    { title: "아몬드", desc: "감정을 느끼지 못하는 소년이 타인과 관계를 맺으며 성장해가는 가슴 뭉클한 이야기." },

                    { title: "넛지 (Nudge)", desc: "강요하지 않고도 사람들의 행동을 더 좋은 방향으로 부드럽게 유도하는 넛지의 힘과 마케팅 원리." },
                    { title: "어떻게 살 것인가", desc: "정치, 사회, 역사를 치열하게 건너온 저자가 던지는, 삶의 의미와 주체적인 행복에 대한 성찰." }

        };

        let currentQuestionIndex = 0;
        let scores = { A: 0, B: 0, C: 0, D: 0 };

        function startTest() {
            document.getElementById("start-screen").classList.remove("active");
            document.getElementById("question-screen").classList.add("active");
            currentQuestionIndex = 0;
            scores = { A: 0, B: 0, C: 0, D: 0 };
            showQuestion();
        }

        function showQuestion() {
            const qData = questions[currentQuestionIndex];
            
            document.getElementById("q-number").innerText = `Question ${currentQuestionIndex + 1} / 10`;
            document.getElementById("q-text").innerText = qData.q;
            
            const progressPercent = ((currentQuestionIndex) / questions.length) * 100;
            document.getElementById("progress-bar").style.width = `${progressPercent}%`;

            const optionsContainer = document.getElementById("options");
            optionsContainer.innerHTML = "";
            
            qData.options.forEach(option => {
                const button = document.createElement("button");
                button.className = "option-btn";
                button.innerText = option.text;
                button.onclick = () => selectOption(option.type);
                optionsContainer.appendChild(button);
            });
        }

        function selectOption(type) {
            scores[type]++;
            currentQuestionIndex++;

            if (currentQuestionIndex < questions.length) {
                showQuestion();
            } else {
                document.getElementById("progress-bar").style.width = "100%";
                setTimeout(showResult, 200);
            }
        }

        // 피셔-예이츠 셔플 알고리즘으로 완벽한 무작위 섞기 기능 구현
        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function showResult() {
            document.getElementById("question-screen").classList.remove("active");
            document.getElementById("result-screen").classList.add("active");

            const sortedTypes = Object.keys(scores).sort((a, b) => scores[b] - scores[a]);
            
            const top1 = sortedTypes[0];
            const top2 = sortedTypes[1];

            const nameMap = {
                "A": "스릴러/추리",
                "B": "감성/에세이",
                "C": "판타지/SF",
                "D": "자기계발/지성"
            };
            
            let combinedName = `${nameMap[top1]} x ${nameMap[top2]} 융합형 취향`;
            let combinedDesc = `당신의 메인 취향은 [${categoryDetails[top1].name}]이며, 서브 취향으로 [${categoryDetails[top2].name}] 성향도 함께 가지고 계시네요! \n\n${categoryDetails[top1].desc} 더불어 ${categoryDetails[top2].desc.replace("당신은 ", "")} 두 가지 매력을 모두 가진 책들을 추천해 드립니다.`;

            document.getElementById("result-name").innerText = combinedName;
            document.getElementById("result-desc").innerText = combinedDesc;

            const bookListContainer = document.getElementById("book-list");
            bookListContainer.innerHTML = "";

            let recommendedBooks = [];
            
            // 복사본을 만들어 완벽하게 랜덤으로 섞음
            const shuffledTop1Books = shuffle([...categoryDetails[top1].books]);
            const shuffledTop2Books = shuffle([...categoryDetails[top2].books]);

            // 1위 카테고리에서 랜덤 2권 추출
            shuffledTop1Books.slice(0, 2).forEach(b => {
                recommendedBooks.push({ ...b, tag: nameMap[top1] });
            });

            // 2위 카테고리에서 랜덤 1권 추출
            shuffledTop2Books.slice(0, 1).forEach(b => {
                recommendedBooks.push({ ...b, tag: nameMap[top2] });
            });

            recommendedBooks.forEach(book => {
                const card = document.createElement("div");
                card.className = "book-card";
                card.innerHTML = `
                    <div class="book-tag">${book.tag} 추천</div>
                    <div class="book-title">📖 ${book.title}</div>
                    <div class="book-desc">${book.desc}</div>
                `;
                bookListContainer.appendChild(card);
            });
        }

        function restartTest() {
            document.getElementById("result-screen").classList.remove("active");
            startTest();
        }
    </script>
</body>
</html>
